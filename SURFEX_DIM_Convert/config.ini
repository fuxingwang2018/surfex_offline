# The configurations of surfex_dim_convert.py
#
# To add a new experiment:
#   1. Add a new [HCLIMEXP_NAME] section below, defining its paths.
#   2. If dir_surfex_month uses {simyear}, add an entry per SURFEXEXP
#      to [simyear_of_exp].
#   3. Set HCLIMEXP / SURFEXEXP in [general] below.
# No Python code needs to change.

[general]

# Choose HCLIMEXP: must match one of the section names below.
# MUMS      500m: NorCP_ERAI_ALD_AROME, NorCP_ALADIN_ERAI
# GreenWave 300m: HCLIM38_Summer2018_STKHM_NEW, HCLIM38_Summer2018_STKHM_NEW_defaultPhys,
#                 HCLIM38_Summer2018_STKHM_NEWphys, HCLIM38_Summer2018_STKHM_DEFphys,
#                 HCLIM38_Summer2018_STKHM_2050phys
#HCLIMEXP: HCLIM43_BRIGHT_Stockholm
#HCLIMEXP: HCLIM43_BRIGHT_NorrLink
HCLIMEXP: HCLIM43_G4E_Malmo

# Comma-separated SURFEX offline experiment name(s).
# BRIGHT:
SURFEXEXP: EV1_PGW1,EV1_PGW2,EV1_PGW3,EV2_PGW1,EV2_PGW2,EV2_PGW3,EV3_PGW1,EV3_PGW2,EV3_PGW3
#SURFEXEXP: zref_default_90s
#SURFEXEXP: zref_default

# SURFEX 1D file(s), comma-separated
#name_surfex_file:SURF_ATM_DIAGNOSTICS.OUT, SURF_ATM.OUT
#name_surfex_file: TEB_PROGNOSTIC.OUT,ISBA_DIAGNOSTICS.OUT,SEAFLUX_DIAGNOSTICS.OUT,FLAKE_DIAGNOSTICS.OUT,TEB_DIAGNOSTICS.OUT
name_surfex_file: ISBA_DIAG_CUMUL.OUT,ISBA_PROGNOSTIC.OUT,TEB_CANOPY.OUT,ISBA_VEG_EVOLUTION.OUT

# ---------------------------------------------------------------------------
# Currently used / verified experiments
# ---------------------------------------------------------------------------

[HCLIM43_BRIGHT_Stockholm]
dir_surfex_sim_1d  = /home/sm_aital/projects/BRIGHT/data_SURFEX/highres/Stockholm/v3/{surfex_exp}
dir_surfex_sim_2d  = /nobackup/rossby27/users/sm_fuxwa/SURFEX_OUT/BRIGHT/Stockholm/v3/{surfex_exp}
dir_surfex_ref_2d  = /nobackup/rossby27/users/sm_fuxwa/SURFEX_FORCING/HCLIM43_FORC/BRIGHT
file_surfex_ref_2d = HCLIM43_ST_2017_PGW3.nc
dir_surfex_month   = OUT_{simyear}
ntile              = 2
mkdir_sim_2d       = true

[HCLIM43_BRIGHT_NorrLink]
